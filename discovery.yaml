  # ---------------- Job-board / aggregator APIs (free, no key) ----------------
  arbeitnow: {max_pages: 6}                 # EU board with many NL/DE tech jobs
  themuse: {max_pages: 3}                   # NL cities x tech categories
  himalayas: {max_pages: 2}                 # remote jobs open to NL
  jobicy: {}                                # remote jobs (NL / Europe / EMEA)
  remotive: {}                              # remote jobs; max 4 requests/day per their terms (interval 6h)
  remoteok: {}                              # remote jobs; attribution required (link kept)
  workingnomads: {}                         # recent remote jobs

  # ---------------- Optional (need free API keys in .env; disabled until set) ----------------
  adzuna: {max_pages: 2}                    # ADZUNA_APP_ID + ADZUNA_APP_KEY
  jooble: {max_pages: 2}                    # JOOBLE_API_KEY
