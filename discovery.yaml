# Job discovery sources and behaviour (see docs/discovery/SOURCES.md).
# Matching/scoring stays in search.yaml. Boards listed under search.yaml `sources:` are still included.
# Every board below was verified against its real public endpoint (2026-11-05). Add/remove freely.

settings:
  concurrency: 3                 # sources fetched in parallel (small VM: keep low)
  request_timeout_seconds: 20
  max_response_mb: 15            # abort oversized responses
  retries: 2                     # per request, exponential backoff + jitter, honours Retry-After
  close_after_missed_scans: 2    # complete ATS listings: close a job after N successful scans without it
  stale_after_days: 21           # jobs only seen on search/aggregator feeds: 'stale' after N days unseen
  aggregator_max_age_days: 30    # ignore aggregator postings older than this
  accept_nl_outside_randstad: true   # e.g. Eindhoven; marked "outside Randstad" in the dashboard
  allow_relocation: false        # true = also accept onsite jobs outside the Netherlands

notifications:
  min_score: null                # include new relevant jobs with score >= this in the per-scan Telegram digest
                                 # (null = search.yaml min_score). One digest per scan, never one message per job.

